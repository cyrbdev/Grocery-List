<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Grocery List</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
        <div>
            <h1 class="title">Grocery List</h1>
            <p class="desc">Type your desired item into the box. Click items on the list to mark them as bought.</p>
        </div>
    </header>
    <main>
        <div>
            <input type="text" id="listInput">
            <button id="addButton">Press to add item</button>
            <div class="dropdown">
                <button id="menuBtn" aria-haspopup="true" aria-expanded="false">Menu ▾</button>
                <ul id="menuList" hidden>
                    <li><button id="showAll">All</button></li>
                    <li><button id="pending">Pending</button></li>
                   <li><button id="purchased">Purchased</button></li>
                </ul>
            </div>
            <div>
                <ul class="theList" id="stillList">
                </ul>
                <ul class="theList" id="purchasedList"></ul>
            </div>
        </div>
    </main>
    <footer>

    </footer>
    <script src="script.js"></script>
    </body>
</html>
